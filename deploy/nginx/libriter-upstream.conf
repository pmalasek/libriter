# Společný upstream pro audiobooks.helpdesk24.works (Libriter)
# i video.helpdesk24.works (Sceniter) – oba weby servíruje tatáž binárka.
#
# Patří do /etc/nginx/conf.d/ na nginx stroji (78.156.131.251).
# Backend: mediater (balíček libriter) na 172.24.0.46:8080

upstream libriter {
    server 172.24.0.46:8080;

    # Znovupoužití spojení k backendu – šetří TCP handshake u SPA,
    # která na jedno zobrazení stránky pošle desítky requestů.
    keepalive 16;
}
