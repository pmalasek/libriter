# Společný upstream pro audiobooks.helpdesk24.works (Libriter)
# i video.helpdesk24.works (Sceniter) – oba weby servíruje tatáž binárka.
#
# Patří do /etc/nginx/conf.d/ na nginx stroj (78.156.131.251). Soubory
# z conf.d/ se vkládají do kontextu http {}, proto jsou tady i log_format
# a limit_req_zone, které oba virtuální servery sdílejí.
#
# Backend: kontejner mediater (docker/compose.prod.yaml) na 172.24.0.46:8081.
# Demo instance (compose.demo.yaml) poslouchá na 172.24.0.46:8082.

upstream libriter {
    server 172.24.0.46:8081;

    # Znovupoužití spojení k backendu – šetří TCP handshake u SPA,
    # která na jedno zobrazení stránky pošle desítky requestů.
    keepalive 16;
}

# Přístupový log bez query stringu. Přehrávání audia i videa nese token
# v adrese (?t=), stejně tak některé další cesty – $request i $request_uri
# by ho do logu zapsaly. $uri je cesta bez parametrů (už dekódovaná
# a normalizovaná), takže token nezůstane v logu na žádné cestě.
log_format mediater_noquery '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

# Limit pro /api/v1/auth/ (přihlášení, registrace, začátek párování TV):
# 10 požadavků za minutu na IP, burst nastavuje location. Backend má vlastní
# jemnější limity (na IP i na přihlašovací jméno); tohle je hrubá první
# vrstva, která zastaví záplavu dřív, než dojde k aplikaci.
limit_req_zone $binary_remote_addr zone=mediater_auth:10m rate=10r/m;
