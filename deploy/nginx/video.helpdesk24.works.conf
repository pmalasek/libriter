# Sceniter – reverse proxy pro video.helpdesk24.works
#
# Patří na nginx stroj (78.156.131.251) do /etc/nginx/sites-available/,
# symlink do sites-enabled/. Upstream `libriter` je v libriter-upstream.conf
# (conf.d/) – stejný backend jako audiobooks.helpdesk24.works. Web Sceniteru
# backend vrátí podle hlavičky Host (SCENITER_HOST v /etc/libriter/libriter.env).
#
# Config je záměrně jen HTTP. TLS doplní
#   certbot --nginx -d video.helpdesk24.works

server {
    listen 80;
    listen [::]:80;
    server_name video.helpdesk24.works;

    # Video se přes web nenahrává; API přijímá jen malé JSON požadavky.
    client_max_body_size 10m;

    # Video i HLS segmenty tečou rovnou ke klientovi – bez bufferování na disk.
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # Playlisty HLS a titulky jsou text; video a obrázky ne.
    gzip_types text/plain text/css text/vtt application/javascript application/json
               application/vnd.apple.mpegurl image/svg+xml application/manifest+json;

    access_log /var/log/nginx/video.access.log;
    error_log  /var/log/nginx/video.error.log;

    location / {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Přehrávání: přímý stream souboru, HLS (playlisty, segmenty) a titulky.
    #
    # Pauza znamená, že prohlížeč přestane číst; při výchozím timeoutu by nginx
    # spojení po dvou minutách shodil. Backend na těchto cestách ruší svůj
    # WriteTimeout ze stejného důvodu. První segment plného převodu může
    # chvíli trvat (ffmpeg startuje), proto i delší čtení.
    #
    # Adresy nesou token pro přehrávání (?t=), proto se nezapisují do access
    # logu – token by jinak zůstal čitelný každému, kdo se dostane k logům.
    location ~ ^/api/v1/sceniter/(media/[^/]+/(stream|hls/master\.m3u8|subtitles/[^/]+)|hls/.+)$ {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        access_log off;
    }

    # Health check bez logování.
    location = /health {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
