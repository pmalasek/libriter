# Sceniter – reverse proxy pro video.helpdesk24.works
#
# Patří na nginx stroj (78.156.131.251) do /etc/nginx/sites-available/,
# symlink do sites-enabled/. Upstream `libriter`, log_format `mediater_noquery`
# a zóna `mediater_auth` jsou v libriter-upstream.conf (conf.d/) – stejný
# backend jako audiobooks.helpdesk24.works. Web Sceniteru backend vrátí podle
# hlavičky Host (SCENITER_HOST v .env backendu, /opt/libriter/.env).
#
# Config je záměrně jen HTTP. TLS doplní
#   certbot --nginx -d video.helpdesk24.works
#
# Hlavičky proxy: X-Real-IP backend přijme jen od adres v TRUSTED_PROXIES
# (.env backendu); True-Client-IP se vždy maže, aby ji klient nepodvrhl.

server {
    listen 80;
    listen [::]:80;
    server_name video.helpdesk24.works;

    # HSTS nastavuje nginx, ostatní bezpečnostní hlavičky (CSP, X-Frame-Options,
    # nosniff, Referrer-Policy) posílá Go server sám. Na :80 ji prohlížeč
    # ignoruje; platit začne v bloku :443, který z tohoto vytvoří certbot.
    # Pozor: add_header uvnitř location ruší všechny add_header ze server
    # bloku – kdyby nějaká location potřebovala vlastní, musí HSTS zopakovat.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Video se přes web nenahrává; API přijímá jen malé JSON požadavky.
    client_max_body_size 10m;

    # Video i HLS segmenty tečou rovnou ke klientovi – bez bufferování na disk.
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # Playlisty HLS a titulky jsou text; video a obrázky ne.
    gzip_types text/plain text/css text/vtt application/javascript application/json
               application/vnd.apple.mpegurl image/svg+xml application/manifest+json;

    # Formát bez query stringu – token pro přehrávání (?t=) se do logu
    # nedostane na žádné cestě. Backend obslouží přes tento host i API
    # Libriteru (třeba audio kapitol), které níž vyjmenované není.
    access_log /var/log/nginx/video.access.log mediater_noquery;
    error_log  /var/log/nginx/video.error.log;

    location / {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Přihlášení, registrace a začátek párování TV – hrubý limit na IP proti
    # hádání hesel (zóna v libriter-upstream.conf). Backend má vlastní limity.
    location /api/v1/auth/ {
        limit_req zone=mediater_auth burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Časté požadavky pod /auth/, které limit výš nesmí brzdit: token pro
    # přehrávání, konfigurace přihlašovací stránky (TV se na ni ptá i při
    # ověření adresy serveru) a dotazování TV na schválení párování (každých
    # 5 s, backend ho omezuje sám). Regex location má přednost před prefixem.
    location ~ ^/api/v1/auth/(stream-token|config|device/token)$ {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Přehrávání: přímý stream souboru, HLS (playlisty, segmenty) a titulky.
    #
    # Pauza znamená, že prohlížeč přestane číst; při výchozím timeoutu by nginx
    # spojení po dvou minutách shodil. Backend na těchto cestách ruší svůj
    # WriteTimeout ze stejného důvodu. První segment plného převodu může
    # chvíli trvat (ffmpeg startuje), proto i delší čtení.
    #
    # Log se tu vypíná kvůli objemu (každý segment); token (?t=) by se do logu
    # nedostal ani tak – formát mediater_noquery ho vynechává.
    location ~ ^/api/v1/sceniter/(media/[^/]+/(stream|hls/(master\.m3u8|keepalive)|subtitles/[^/]+)|hls/.+)$ {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        access_log off;
    }

    # Health check bez logování.
    location = /health {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
