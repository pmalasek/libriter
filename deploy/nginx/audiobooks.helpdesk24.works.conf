# Libriter – reverse proxy pro audiobooks.helpdesk24.works
#
# Patří na nginx stroj (78.156.131.251) do /etc/nginx/sites-available/,
# symlink do sites-enabled/. Backend je jediná Go binárka (mediater), která
# servíruje weby Libriteru i Sceniteru, /api/v1 a /health – proxy tedy stačí
# jedna, na /. Které webové rozhraní prohlížeč dostane, rozhoduje backend
# podle hlavičky Host (LIBRITER_HOST v .env backendu, /opt/libriter/.env).
#
# Upstream `libriter`, log_format `mediater_noquery` a zóna `mediater_auth`
# jsou společné s video.helpdesk24.works a definované v libriter-upstream.conf
# (patří do /etc/nginx/conf.d/). Dvě definice téhož by nginx odmítl.
#
# Config je záměrně jen HTTP. TLS blok a redirect doplní
#   certbot --nginx -d audiobooks.helpdesk24.works
# které si nastavení z tohoto server bloku naklonuje do :443.
#
# Hlavičky proxy: X-Real-IP backend přijme jen od adres v TRUSTED_PROXIES
# (.env backendu) – musí tam být adresa tohoto stroje, jinak rate limit
# přihlášení na backendu vidí všechny klienty jako jednu IP. True-Client-IP
# se vždy maže, aby ji klient nemohl podvrhnout přes proxy.

server {
    listen 80;
    listen [::]:80;
    server_name audiobooks.helpdesk24.works;

    # HSTS nastavuje nginx, ostatní bezpečnostní hlavičky (CSP, X-Frame-Options,
    # nosniff, Referrer-Policy) posílá Go server sám. Na :80 ji prohlížeč
    # ignoruje; platit začne v bloku :443, který z tohoto vytvoří certbot.
    # Pozor: add_header uvnitř location ruší všechny add_header ze server
    # bloku – kdyby nějaká location potřebovala vlastní, musí HSTS zopakovat.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Backend posílá HSTS sám, když dostane X-Forwarded-Proto: https – tady se
    # jeho hlavička skryje, aby v odpovědi nebyla dvakrát.
    proxy_hide_header Strict-Transport-Security;

    # MAX_UPLOAD_MB=3072 v .env backendu – nginx musí pustit aspoň tolik,
    # jinak upload skončí na 413 dřív, než se vůbec dostane k aplikaci.
    # Import knih posílá soubory po jednom, takže limit platí na soubor.
    client_max_body_size 3g;

    # Obálky, fotky autorů i audio kapitol chodí přes http.ServeFile/ServeContent,
    # tedy s Range hlavičkami. Vypnuté bufferování posílá byty rovnou klientovi
    # a nenafukuje /var/lib/nginx/proxy_temp.
    proxy_buffering off;
    proxy_request_buffering off;

    # Backend má WriteTimeout 60 s; scan metadat z databazeknih.cz umí být pomalý,
    # tak ať nginx neupadne dřív než aplikace.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # Bez audio/* a image/* – ty jsou už komprimované a gzip by je jen zdržel.
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Formát bez query stringu – token pro přehrávání (?t=) se do logu
    # nedostane na žádné cestě, ani když ji níž nikdo nevyjmenuje.
    access_log /var/log/nginx/audiobooks.access.log mediater_noquery;
    error_log  /var/log/nginx/audiobooks.error.log;

    location / {
        proxy_pass http://libriter;

        # HTTP/1.1 + prázdný Connection je podmínka pro keepalive k upstreamu.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Aplikace si Cache-Control nastavuje sama (hashovaná assets navždy,
        # zbytek no-cache), nginx do toho nesahá.
    }

    # Přihlášení, registrace a začátek párování TV – hrubý limit na IP proti
    # hádání hesel (zóna v libriter-upstream.conf). Backend má vlastní limity.
    location /api/v1/auth/ {
        limit_req zone=mediater_auth burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Časté požadavky pod /auth/, které limit výš nesmí brzdit: token pro
    # přehrávání (přehrávač si ho bere s každou kapitolou), konfigurace
    # přihlašovací stránky a dotazování TV na schválení párování (každých 5 s,
    # backend ho omezuje sám). Regex location má přednost před prefixem výš.
    location ~ ^/api/v1/auth/(stream-token|config|device/token)$ {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Audio kapitol – dlouhé odpovědi, které se chovají jinak než zbytek API.
    #
    # Pauza v přehrávači znamená, že prohlížeč přestane číst. Nginx tím přestane
    # číst i z backendu a při výchozím proxy_read_timeout by spojení po dvou
    # minutách shodil – posluchač by po návratu z pauzy dostal chybu. Backend na
    # této cestě ruší svůj WriteTimeout ze stejného důvodu.
    #
    # Log se tu vypíná jen kvůli objemu (každý Range požadavek); token (?t=)
    # by se do logu nedostal ani tak – formát mediater_noquery ho vynechává.
    location ~ ^/api/v1/chapters/[^/]+/audio$ {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        access_log off;
    }

    # Import knih – nahrávání velkých souborů (PUT /api/v1/admin/import/{id}/files).
    # Backend si na této cestě prodlužuje timeouty na 2 h; nginx nesmí spojení
    # shodit dřív. Bufferování požadavku je vypnuté výš, soubor teče rovnou.
    location ~ ^/api/v1/admin/import/[^/]+/files$ {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header True-Client-IP    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        client_body_timeout 10m;
        proxy_read_timeout  2h;
        proxy_send_timeout  2h;
    }

    # Health check bez logování – ať se přístupový log nezanese pollingem.
    location = /health {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
