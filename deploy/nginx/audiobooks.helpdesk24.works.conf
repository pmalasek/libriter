# Libriter – reverse proxy pro audiobooks.helpdesk24.works
#
# Patří na nginx stroj (78.156.131.251) do /etc/nginx/sites-available/,
# symlink do sites-enabled/. Backend je jediná Go binárka, která servíruje
# jak SPA, tak /api/v1 a /health – proxy tedy stačí jedna, na /.
#
# Backend: libriter na 172.24.0.46:8080
#
# Config je záměrně jen HTTP. TLS blok a redirect doplní
#   certbot --nginx -d audiobooks.helpdesk24.works
# které si nastavení z tohoto server bloku naklonuje do :443.

upstream libriter {
    server 172.24.0.46:8080;

    # Znovupoužití spojení k backendu – šetří TCP handshake u SPA,
    # která na jedno zobrazení stránky pošle desítky requestů.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name audiobooks.helpdesk24.works;

    # MAX_UPLOAD_MB=500 v .env backendu – nginx musí pustit aspoň tolik,
    # jinak upload skončí na 413 dřív, než se vůbec dostane k aplikaci.
    client_max_body_size 512m;

    # Obálky, fotky autorů i audio kapitol chodí přes http.ServeFile/ServeContent,
    # tedy s Range hlavičkami. Vypnuté bufferování posílá byty rovnou klientovi
    # a nenafukuje /var/lib/nginx/proxy_temp.
    proxy_buffering off;
    proxy_request_buffering off;

    # Backend má WriteTimeout 60 s; scan metadat z databazeknih.cz umí být pomalý,
    # tak ať nginx neupadne dřív než aplikace.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # Bez audio/* a image/* – ty jsou už komprimované a gzip by je jen zdržel.
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    access_log /var/log/nginx/audiobooks.access.log;
    error_log  /var/log/nginx/audiobooks.error.log;

    location / {
        proxy_pass http://libriter;

        # HTTP/1.1 + prázdný Connection je podmínka pro keepalive k upstreamu.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Aplikace si Cache-Control nastavuje sama (hashovaná assets navždy,
        # zbytek no-cache), nginx do toho nesahá.
    }

    # Audio kapitol – dlouhé odpovědi, které se chovají jinak než zbytek API.
    #
    # Pauza v přehrávači znamená, že prohlížeč přestane číst. Nginx tím přestane
    # číst i z backendu a při výchozím proxy_read_timeout by spojení po dvou
    # minutách shodil – posluchač by po návratu z pauzy dostal chybu. Backend na
    # této cestě ruší svůj WriteTimeout ze stejného důvodu.
    #
    # Adresa nese token pro přehrávání (?t=), proto se nezapisuje do access logu:
    # token by jinak zůstal čitelný každému, kdo se dostane k logům.
    location ~ ^/api/v1/chapters/[^/]+/audio$ {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        access_log off;
    }

    # Health check bez logování – ať se přístupový log nezanese pollingem.
    location = /health {
        proxy_pass http://libriter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
