<!-- Pozadí adaptivní ikony Androidu: stejný gradient jako icon.svg, bez kresby. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17E3EA"/>
      <stop offset="0.35" stop-color="#0A8EA3"/>
      <stop offset="0.7" stop-color="#0A5674"/>
      <stop offset="1" stop-color="#07304D"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
</svg>
